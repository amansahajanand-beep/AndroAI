name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          pip install -e "packages/contracts[dev]" -e "packages/storage[dev]" -e "packages/android-tools[dev]" -e "apps/api[dev]"
          -e workers/orchestration -e workers/ai-agent
          -e workers/android-build -e workers/android-test
      - run: python -c "import androai_orchestration.main, androai_agent.main, androai_android_build.main, androai_android_test.main"
      - run: pytest packages/contracts packages/storage packages/android-tools apps/api
      - name: Migration SQL renders for PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://u:p@localhost/db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
        run: alembic upgrade head --sql > /dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
