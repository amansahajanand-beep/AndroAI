# Sample reverse proxy (not wired into docker-compose yet).
events {}
http {
  server {
    listen 80;
    # Upload cap; must be >= UPLOAD_MAX_BYTES. The API enforces the same limit.
    client_max_body_size 210m;
    client_body_timeout 60s;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr; }
    location /health { proxy_pass http://api:8000; }
    location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
  }
}
