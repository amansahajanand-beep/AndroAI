[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "androai-codegen"
version = "0.1.0"
description = "Android code generation, editing, review and repair engine (library). Owner: Person 3."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
androai_codegen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
