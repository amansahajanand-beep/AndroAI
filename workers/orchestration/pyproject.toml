[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "androai-orchestration"
version = "0.1.0"
description = "LangGraph-based agent orchestration worker."
requires-python = ">=3.11"
dependencies = [
    "androai-contracts",
    "celery[redis]>=5.4",
]

[project.scripts]
androai-orchestration = "androai_orchestration.main:main"

[tool.setuptools.packages.find]
where = ["src"]
