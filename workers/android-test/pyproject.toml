[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "androai-android-test"
version = "0.1.0"
description = "Android test worker (separately deployable)."
requires-python = ">=3.11"
dependencies = [
    "androai-contracts",
    "celery[redis]>=5.4",
]

[project.scripts]
androai-android-test = "androai_android_test.main:main"

[tool.setuptools.packages.find]
where = ["src"]
