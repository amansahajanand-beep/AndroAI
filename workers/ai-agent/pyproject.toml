[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "androai-ai-agent"
version = "0.1.0"
description = "Code-generation agent worker."
requires-python = ">=3.11"
dependencies = [
    "androai-contracts",
    "androai-codegen",
    "celery[redis]>=5.4",
]

[project.scripts]
androai-ai-agent = "androai_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
